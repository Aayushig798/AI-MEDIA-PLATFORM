name: Deploy AI Media Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd ~/AI-MEDIA-PLATFORM
            # fetch + reset instead of pull: survives a rewritten main (the untracked .env is untouched)
            git fetch origin main
            git reset --hard origin/main
            # Builds and starts the app + Postgres together (docker-compose.yml)
            bash scripts/deploy.sh