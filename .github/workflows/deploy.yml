name: Deploy AI Media Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/AI-MEDIA-PLATFORM
            git pull origin main
            docker build -t ai-media-platform .
            docker stop ai-media-platform || true
            docker rm ai-media-platform || true
            docker run -d \
              --name ai-media-platform \
              --env-file .env \
              -p 3000:3000 \
              --restart unless-stopped \
              ai-media-platform
